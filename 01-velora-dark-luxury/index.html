<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Velora — Dark Luxury Car Rental Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: 'Archivo', sans-serif; background: #0a0a0b; }
  a { text-decoration: none; color: inherit; }
  a:hover { color: #fff; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    background: #0a0a0b;
  }

  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 60%;
    pointer-events: none;
  }

  .hero .overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(180deg, rgba(8,8,10,0.55) 0%, rgba(8,8,10,0.15) 30%, rgba(8,8,10,0.25) 55%, rgba(8,8,10,0.92) 100%);
    pointer-events: none;
  }

  /* NAVBAR */
  .navbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 34px 56px;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 42px;
  }

  .nav-left a {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
  }

  .nav-left a.active {
    color: #fff;
    border-bottom: 2px solid #fff;
    padding-bottom: 3px;
  }

  .logo {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .browse-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #FAF9F5;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 10px;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .browse-btn:hover { background: #e9e9ec; color: #0a0a0b; }
  .browse-btn span { font-size: 15px; }

  /* GIANT HEADLINE */
  .giant-headline {
    position: absolute;
    top: 92px;
    width: 100%;
    z-index: 2;
    text-align: center;
    pointer-events: none;
  }
  .giant-headline h1 {
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    white-space: nowrap;
    font-size: 13.3vw;
    background: linear-gradient(180deg, #ffffff 55%, #b8b8bd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }

  /* BOTTOM-LEFT COPY */
  .hero-copy {
    position: absolute;
    left: 56px;
    bottom: 56px;
    z-index: 3;
    max-width: 620px;
  }
  .hero-copy h2 {
    color: #fff;
    font-weight: 600;
    font-size: clamp(38px, 5.8vw, 66px);
    line-height: 0.98;
    letter-spacing: -0.02em;
  }
  .hero-copy p {
    color: rgba(255,255,255,0.82);
    font-size: 15px;
    font-weight: 400;
    line-height: 1.5;
    max-width: 480px;
    margin-top: 18px;
  }

  .discover-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 13px 24px;
    border-radius: 10px;
    margin-top: 32px;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .discover-btn:hover {
    background: #fff;
    color: #0a0a0b;
    border-color: #fff;
  }
  .discover-btn span { font-size: 15px; }

  /* Responsive tweaks */
  @media (max-width: 860px) {
    .navbar { padding: 22px 24px; }
    .nav-left { gap: 22px; }
    .nav-left a { font-size: 12px; }
    .logo { font-size: 20px; }
    .hero-copy { left: 24px; right: 24px; bottom: 32px; max-width: none; }
  }
  @media (max-width: 560px) {
    .nav-left { display: none; }
  }
</style>
</head>
<body>

<section class="hero">
  <video id="heroVideo" autoplay loop muted playsinline preload="auto" aria-hidden="true">
    <!-- PLACEHOLDER: swap for Higgsfield-generated asset -->
    <source src="https://cdn.sceneai.art/Hero%20section%20video%20file%20(2)/37091057-3719-4207-815c-745ebf57aeb4.mp4" type="video/mp4" />
  </video>
  <div class="overlay"></div>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="active">Home</a>
      <a href="#">About</a>
      <a href="#">Cars</a>
      <a href="#">Contact</a>
    </div>
    <div class="logo">VELORA</div>
    <a href="#" class="browse-btn">Browse cars <span>→</span></a>
  </nav>

  <div class="giant-headline">
    <h1>REGAL DRIVE</h1>
  </div>

  <div class="hero-copy">
    <h2>Rent Your Dream Luxury Car Today</h2>
    <p>Enjoy a premium rental experience with exclusive cars, seamless booking, and honest pricing.</p>
    <a href="#" class="discover-btn">DISCOVER NOW <span>↗</span></a>
  </div>
</section>

<script>
  (function () {
    const video = document.getElementById('heroVideo');
    if (!video) return;

    const tryPlay = () => {
      const p = video.play();
      if (p && typeof p.catch === 'function') p.catch(() => {});
    };

    video.addEventListener('pause', tryPlay);
    video.addEventListener('ended', tryPlay);
    video.addEventListener('loadedmetadata', tryPlay);
    video.addEventListener('canplay', tryPlay);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) tryPlay();
    });

    tryPlay();

    const watchdog = setInterval(() => {
      if (video.paused) tryPlay();
    }, 1000);

    window.addEventListener('beforeunload', () => clearInterval(watchdog));
  })();
</script>

</body>
</html>
