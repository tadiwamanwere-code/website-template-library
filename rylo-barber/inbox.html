<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Rylo | Booking inbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#111211;color:#eee8db;font:16px/1.6 system-ui,sans-serif;padding:25px;max-width:1000px;margin:auto}h1{font:48px Georgia,serif;margin:20px 0}a{color:inherit}button,input,select{font:inherit;padding:12px;border:1px solid #575b51;background:#1b1d1a;color:#eee8db;border-radius:0;min-height:48px}button{cursor:pointer}button:disabled{opacity:.5}label{display:block;margin-bottom:10px}form{display:flex;flex-wrap:wrap;gap:12px}input{max-width:100%}article{border:1px solid #45493f;padding:22px;margin-top:20px}h2{margin:0 0 8px;font-size:22px}p{margin:6px 0;overflow-wrap:anywhere}.dim{color:#b8baaf;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.error{color:#efb2a7}#inbox[hidden],#login[hidden]{display:none}.note{white-space:pre-wrap}button:focus-visible,a:focus-visible{outline:2px solid #b59a69;outline-offset:4px}
</style></head><body><a href="./">← Rylo website</a><h1>Booking inbox.</h1><p class="dim">New bookings are clearly marked as demos. Demo slots use Harare time (UTC+2). Older appointment requests still need direct confirmation.</p><div id="login"><label for="pass" style="margin-top:30px">Your website builder passcode</label><form id="login-form"><input type="password" id="pass" autocomplete="current-password" required><button>Open inbox</button></form></div><p id="message" role="status"></p><section id="inbox" hidden><div class="bar"><label>Show <select id="filter"><option value="all">All requests</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><button id="refresh">Refresh</button><button id="logout">Sign out</button></div><div id="list"></div></section><script>
const $=s=>document.querySelector(s);let pass='',records=[];
async function call(method,body){const r=await fetch('/api/rylo-booking',{method,headers:{'x-rylo-passcode':pass,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const b=await r.json();if(!r.ok)throw Error(b.error||'Could not load bookings.');return b;}
function element(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
function render(){const list=$('#list');list.replaceChildren();const visible=records.filter(r=>$('#filter').value==='all'||r.status===$('#filter').value);if(!visible.length)list.append(element('p','No requests here yet.'));visible.forEach(r=>{const card=document.createElement('article');card.append(element('h2',r.name+' · '+r.service));if(r.demo)card.append(element('p','DEMO · '+r.barberName+' · '+r.duration+' minutes','dim'));card.append(element('p',r.date+' at '+r.time+' (UTC'+(r.offset<=0?'+':'−')+Math.abs(r.offset/60)+')'));const phone=element('a',r.phone);phone.href='tel:'+r.phone.replace(/[^+\d]/g,'');card.append(phone);if(r.notes)card.append(element('p',r.notes,'note'));card.append(element('p',r.reference+' · '+r.status,'dim'));const actions=element('div','','actions');const status=document.createElement('select');status.setAttribute('aria-label','Booking status for '+r.name);['pending','confirmed','completed','cancelled'].forEach(s=>{const o=element('option',s);o.value=s;status.append(o)});status.value=r.status;const save=element('button','Save status');save.onclick=async()=>{save.disabled=true;try{await call('PATCH',{id:r.id,status:status.value});r.status=status.value;render();$('#message').textContent='Status saved. Contact the customer directly about the change.'}catch(e){$('#message').textContent=e.message}finally{save.disabled=false}};const remove=element('button','Delete');remove.onclick=async()=>{if(!confirm('Delete this booking and its contact details?'))return;remove.disabled=true;try{await call('DELETE',{id:r.id});records=records.filter(x=>x.id!==r.id);render()}catch(e){$('#message').textContent=e.message;remove.disabled=false}};actions.append(status,save,remove);card.append(actions);list.append(card)})}
async function load(){records=(await call('GET')).bookings;$('#login').hidden=true;$('#inbox').hidden=false;$('#message').textContent='';render()}
$('#login-form').onsubmit=async e=>{e.preventDefault();pass=$('#pass').value;const b=e.submitter;b.disabled=true;try{await load();$('#pass').value=''}catch(e){$('#message').textContent=e.message}finally{b.disabled=false}};$('#filter').onchange=render;$('#refresh').onclick=async()=>{try{await load()}catch(e){$('#message').textContent=e.message}};$('#logout').onclick=()=>{pass='';records=[];$('#list').replaceChildren();$('#inbox').hidden=true;$('#login').hidden=false;$('#message').textContent='Signed out.'};
</script></body></html>
